<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https: data:; style-src 'self'; font-src 'self'; script-src 'self'" />
  <title>Contexto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home-mode">
  <aside id="sidebar">
    <div class="drag"><img class="logo" src="logo.png" alt="" /><span class="brand">Contexto</span></div>
    <form id="add-form">
      <input id="add-url" placeholder="Adicionar site (ex: bbc.com/news)" autocomplete="off" />
      <button title="Adicionar fonte">+</button>
    </form>
    <nav id="sources"></nav>
    <div id="progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-live="polite">
      <div class="pg-top"><span id="pg-label"></span><span id="pg-count"></span></div>
      <div class="pg-track"><div id="bar"></div></div>
      <div id="pg-detail" class="pg-detail"></div>
    </div>
    <div class="side-actions">
      <button id="btn-refresh">↻ Atualizar tudo</button>
      <button id="btn-settings">⚙ Configurações</button>
    </div>
  </aside>

  <section id="home">
    <div class="home-inner"><div id="home-body"></div></div>
  </section>

  <section id="list-pane">
    <header>
      <input id="search" type="search" placeholder="Buscar notícias…" />
      <button class="icon" id="btn-dates" title="Buscar datas de publicação (artigos sem data)" aria-label="Buscar datas de publicação"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg></button>
      <button class="icon" id="btn-translate-all" title="Traduzir e resumir as notícias pendentes" aria-label="Traduzir notícias pendentes"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg></button>
    </header>
    <div id="filters" role="group" aria-label="Filtros">
      <button class="chip" id="f-unread" aria-pressed="false">Não lidas</button>
      <span class="sep"></span>
      <button class="chip" data-period="today" aria-pressed="false">Hoje</button>
      <button class="chip" data-period="week" aria-pressed="false">Esta semana</button>
      <button class="chip" data-period="month" aria-pressed="false">Este mês</button>
      <span class="sep"></span>
      <button class="chip" data-tr="yes" aria-pressed="false">Traduzidas</button>
      <button class="chip" data-tr="no" aria-pressed="false">Não traduzidas</button>
    </div>
    <ul id="articles"></ul>
  </section>

  <main id="reader">
    <div id="empty">Selecione uma notícia<br /><small>ou adicione um site na barra lateral</small></div>
    <section id="gsummary" class="gsum" hidden aria-live="polite"></section>
    <article id="article" hidden>
      <div class="meta"><span id="a-source"></span><span id="a-date"></span></div>
      <h1 id="a-title"></h1>
      <p id="a-orig-title" class="orig"></p>
      <div id="a-summary" class="summary" hidden></div>
      <div class="toolbar">
        <button id="btn-translate" class="primary">Resumir e traduzir</button>
        <button id="btn-date" hidden title="Baixa a página de novo para descobrir a data">Atualizar data</button>
        <button class="icon danger" id="btn-delete" title="Excluir artigo" aria-label="Excluir artigo"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
        <button id="btn-original">Abrir original ↗</button>
        <button id="btn-toggle" hidden>Ver texto original</button>
      </div>
      <div id="a-error" class="error" hidden></div>
      <div id="a-body"></div>
    </article>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>Configurações</h2>
      <label>Chave da OpenRouter
        <input id="s-key" type="password" placeholder="sk-or-…" autocomplete="off" />
        <small id="s-key-hint"></small>
      </label>
      <label>Modelo
        <input id="s-model" placeholder="google/gemini-2.5-flash" />
        <small>Qualquer modelo da OpenRouter. Modelos "flash"/"mini" são baratos e bons para isso.</small>
      </label>
      <label class="chk"><input type="checkbox" id="s-auto" /> Traduzir automaticamente novas notícias ao atualizar</label>
      <label class="chk"><input type="checkbox" id="s-autosum" /> Gerar resumos automaticamente, só para grupos com notícias não lidas</label>
      <div class="row"><button value="cancel" type="button" id="s-cancel">Cancelar</button><button class="primary" id="s-save" type="submit">Salvar</button></div>
    </form>
  </dialog>

  <div id="toast" hidden></div>
  <script src="app.js"></script>
  <script src="home.js"></script>
</body>
</html>
